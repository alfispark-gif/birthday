<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>birthday-surprise.exe</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app-window">

    <!-- Custom titlebar (color changes per scene, no OS frame, like the reference video) -->
    <div id="titlebar">
      <button id="btn-back" class="tb-btn" title="Back">&#8592;</button>
      <div id="tb-spacer"></div>
      <button id="btn-min" class="tb-btn" title="Minimize">&#9472;</button>
      <button id="btn-close" class="tb-btn" title="Close">&#10005;</button>
    </div>

    <div id="stage">

      <!-- Scene 0: Intro / secret message teaser -->
      <section class="scene active" data-theme="cream" id="scene-0">
        <canvas class="critter critter-left" id="c0-a" width="16" height="16"></canvas>
        <canvas class="critter critter-right" id="c0-b" width="16" height="16"></canvas>
        <p class="line">There is a secret message for</p>
        <input id="name-input" type="text" maxlength="16" value="najiel" />
        <button class="cta" id="btn-start">tap to see &#8594;</button>
      </section>

      <!-- Scene 1: Gift 1 -->
      <section class="scene" data-theme="pink" id="scene-1">
        <h1 class="title">You have a<br/>GIFT!</h1>
        <button class="cta" id="btn-open-1">open gift?</button>
        <canvas class="critter critter-center" id="c1" width="16" height="16"></canvas>
      </section>

      <!-- Scene 1b: opening animation -->
      <section class="scene" data-theme="pink" id="scene-1b">
        <h1 class="title">You have a<br/>GIFT!</h1>
        <p class="line">opening gift&hellip;</p>
        <div class="gift-box" id="gift-box-1">
          <canvas width="32" height="32" id="giftcanvas1"></canvas>
        </div>
      </section>

      <!-- Scene 2: Birthday message 1 -->
      <section class="scene" data-theme="blue" id="scene-2">
        <h1 class="title" id="bday-title-1">happy 15th<br/>birthday, najiel</h1>
        <canvas class="critter critter-center" id="c2" width="16" height="16"></canvas>
        <div class="row-balloons">
          <canvas class="balloon" id="b1" width="10" height="14"></canvas>
          <canvas class="cake" id="cake1" width="16" height="12"></canvas>
          <canvas class="balloon" id="b2" width="10" height="14"></canvas>
        </div>
        <button class="cta" id="btn-next-1">next&hellip;</button>
      </section>

      <!-- Scene 3: transition / hint of second gift -->
      <section class="scene" data-theme="orange" id="scene-3">
        <p class="line">huh? what's this?</p>
        <p class="line">looks like&hellip;</p>
        <canvas class="critter critter-center" id="c3" width="16" height="16"></canvas>
        <button class="cta ghost" id="btn-next-2">&#8594;</button>
      </section>

      <!-- Scene 4: hint gift again -->
      <section class="scene" data-theme="cream" id="scene-4">
        <p class="line">hmm&hellip; it seems like<br/>you have a gift<br/>again</p>
        <p class="line small hidden" id="opening-2-text">opening gift&hellip;</p>
        <button class="cta hidden" id="btn-find-out">find out&hellip;!</button>
      </section>

      <!-- Scene 4b: opening animation 2 -->
      <section class="scene" data-theme="cream" id="scene-4b">
        <p class="line">opening gift&hellip;</p>
        <div class="gift-box" id="gift-box-2">
          <canvas width="32" height="32" id="giftcanvas2"></canvas>
        </div>
      </section>

      <!-- Scene 5: Birthday message 2 -->
      <section class="scene" data-theme="green" id="scene-5">
        <h1 class="title" id="bday-title-2">For the second<br/>time, happy 15th<br/>birthday, najiel</h1>
        <canvas class="critter critter-center" id="c5" width="16" height="16"></canvas>
        <canvas class="confetti" id="conf-left" width="12" height="16"></canvas>
        <canvas class="confetti right" id="conf-right" width="12" height="16"></canvas>
        <button class="cta" id="btn-next-3">next&hellip;</button>
      </section>

      <!-- Scene 6: Final letter -->
      <section class="scene" data-theme="lavender" id="scene-6">
        <div class="letter-heads">
          <div class="letter-col">
            <p class="line small">From me&hellip;</p>
            <canvas class="critter" id="c6-a" width="16" height="16"></canvas>
          </div>
          <div class="letter-col">
            <p class="line small" id="letter-to">&hellip;to you, najiel</p>
            <canvas class="critter" id="c6-b" width="16" height="16"></canvas>
          </div>
        </div>
        <p class="letter-body" id="letter-body"></p>
        <button class="cta hidden" id="btn-replay">replay &#8635;</button>
      </section>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
